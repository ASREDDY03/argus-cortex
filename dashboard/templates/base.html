<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Argus Cortex{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: .9rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
    header h1 span { color: #60a5fa; }
    header nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: .875rem;
      transition: color .15s;
    }
    header nav a:hover { color: #e2e8f0; }

    /* ── Layout ── */
    .container { max-width: 1060px; margin: 0 auto; padding: 2rem 1.25rem; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: .5rem; }
    .card h3 { font-size: .95rem; font-weight: 600; }

    /* ── Severity badges ── */
    .badge {
      display: inline-block;
      padding: .2em .65em;
      border-radius: 5px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .badge-critical { background: #fee2e2; color: #b91c1c; }
    .badge-high     { background: #ffedd5; color: #c2410c; }
    .badge-medium   { background: #fef9c3; color: #a16207; }
    .badge-low      { background: #dcfce7; color: #15803d; }
    .badge-security { background: #ede9fe; color: #6d28d9; }
    .badge-info     { background: #e0f2fe; color: #0369a1; }

    /* ── Status pills ── */
    .pill {
      display: inline-block;
      padding: .15em .6em;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
    }
    .pill-pending    { background: #fef9c3; color: #854d0e; }
    .pill-processing { background: #dbeafe; color: #1e40af; }
    .pill-completed  { background: #dcfce7; color: #15803d; }
    .pill-failed     { background: #fee2e2; color: #b91c1c; }

    /* ── Code blocks ── */
    .code-wrap { margin-top: .6rem; }
    .code-label { font-size: .7rem; font-weight: 700; text-transform: uppercase;
                  letter-spacing: .06em; color: #64748b; margin-bottom: .25rem; }
    pre.code {
      background: #0f172a;
      color: #e2e8f0;
      padding: .9rem 1rem;
      border-radius: 7px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: .8rem;
      line-height: 1.55;
      overflow-x: auto;
      white-space: pre;
      max-height: 260px;
      overflow-y: auto;
    }
    pre.code.old { background: #1c0a0a; border-left: 3px solid #ef4444; }
    pre.code.new { background: #071c0a; border-left: 3px solid #22c55e; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: .5rem 1.25rem;
      border-radius: 7px;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-ghost { background: #f1f5f9; color: #475569; }
    .btn-ghost:hover { background: #e2e8f0; }

    /* ── Checkbox card toggle ── */
    .finding-card { border: 2px solid #e2e8f0; border-radius: 10px; padding: 1.25rem; margin-bottom: .85rem; transition: border-color .15s; }
    .finding-card.approved { border-color: #86efac; background: #f0fdf4; }
    .finding-card.rejected { border-color: #fca5a5; background: #fff5f5; opacity: .7; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; padding: .6rem .75rem; background: #f8fafc; color: #64748b;
         font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
         border-bottom: 2px solid #e2e8f0; }
    td { padding: .65rem .75rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }

    /* ── Misc ── */
    .section-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #64748b;
      margin-bottom: 1rem;
    }
    .meta { font-size: .8rem; color: #64748b; }
    .empty { color: #94a3b8; font-style: italic; font-size: .9rem; text-align: center; padding: 2rem; }
    .monospace { font-family: 'SF Mono', Consolas, monospace; font-size: .8rem; }
    .gap { margin-top: 1.5rem; }
    .flex { display: flex; align-items: center; gap: .6rem; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    a { color: #2563eb; }
    a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      header { padding: .8rem 1rem; }
      .container { padding: 1rem .75rem; }
      .card { padding: 1rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>🤖 Argus <span>Cortex</span></h1>
    <nav>
      <a href="/">Dashboard</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
